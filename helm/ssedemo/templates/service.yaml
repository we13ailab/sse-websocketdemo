apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssedemo.fullname" . }}
  labels:
    {{- include "ssedemo.labels" . | nindent 4 }}
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "ssedemo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
