app:
  profile: prod

# Tracking state is in memory and cannot be shared across pods.
replicaCount: 1

image:
  repository: ssedemo
  tag: "0.0.1-SNAPSHOT"
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  hosts:
    - host: ssedemo.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
