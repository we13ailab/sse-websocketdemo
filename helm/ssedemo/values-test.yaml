app:
  profile: test

replicaCount: 1

image:
  repository: ssedemo
  tag: test
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  hosts:
    - host: ssedemo-test.example.test
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 768Mi
